name: Daily ENTSO-E update

# Manual backup trigger only. The primary schedule runs inside the Hostinger
# Node app (server.js + node-cron at 06:00 Europe/Berlin → ~/enerlyzer-etl/daily.sh).
# GitHub Actions cron is unreliable (often 1–3h late) and this Node hosting plan
# has no hPanel Cron Jobs UI — so the in-app scheduler is the source of truth.
#
# The SSH key remains restricted to daily.sh via Forced Command on the server.
# Secrets stay private; this workflow never runs from fork PRs.

on:
  workflow_dispatch: {}

concurrency:
  group: daily-entsoe
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger ENTSO-E import + summary rebuild on Hostinger (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" true
