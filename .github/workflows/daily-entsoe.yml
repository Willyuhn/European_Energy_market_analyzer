name: Daily ENTSO-E update

# Backup trigger only. Primary schedule runs inside the Hostinger Node app:
#   - 06:00 Europe/Berlin via node-cron
#   - catch-up every 30 min until logs/daily_ok_YYYYMMDD exists
# This workflow is a safety net (GitHub cron is often late). daily.sh is
# idempotent (flock + OK marker) so overlapping runs are harmless.
#
# SSH key is Forced-Command restricted to daily.sh on the server.

on:
  schedule:
    - cron: "30 8 * * *" # ~10:30 CEST — backup if Node catch-up failed
  workflow_dispatch: {}

concurrency:
  group: daily-entsoe
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger ENTSO-E import + summary rebuild on Hostinger (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$SSH_HOST" true
