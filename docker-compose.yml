services:
  enerlyzer:
    build:
      context: .
    container_name: enerlyzer
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
